<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrate Employee Purchases Table</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .warning {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .success {
      background: #d4edda;
      border-left: 4px solid #28a745;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .error {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    #output {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .input-group {
      margin: 15px 0;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Migrate Employee Purchases Table</h1>
    <p>This will update the <code>employee_purchases</code> table to use <code>employee_name</code> (text input) instead of <code>staff_id</code> (foreign key).</p>
    
    <div class="warning">
      <strong>⚠️ WARNING:</strong> This will drop the existing table and recreate it. All existing data will be deleted.
    </div>

    <div class="input-group">
      <label for="supabaseUrl">Supabase URL:</label>
      <input type="text" id="supabaseUrl" placeholder="https://xxxxx.supabase.co" />
    </div>

    <div class="input-group">
      <label for="supabaseKey">Supabase Service Role Key:</label>
      <input type="password" id="supabaseKey" placeholder="eyJhbGc..." />
    </div>

    <button onclick="runMigration()" id="runBtn">Run Migration</button>

    <div id="output"></div>
  </div>

  <script>
    const SQL = `-- Migration: Update employee_purchases table to use employee_name instead of staff_id
-- This removes the foreign key constraint and uses manual text input

-- Drop the old table (WARNING: This will delete all existing data)
DROP TABLE IF EXISTS employee_purchases CASCADE;

-- Create new table with employee_name field
CREATE TABLE employee_purchases (
  id SERIAL PRIMARY KEY,
  
  -- Employee Info (manual text input, no foreign key)
  employee_name TEXT NOT NULL,
  
  -- Purchase Details
  item_name TEXT NOT NULL,
  quantity INTEGER NOT NULL CHECK (quantity > 0),
  amount DECIMAL(10, 2) NOT NULL CHECK (amount >= 0),
  
  -- Dates
  purchase_date TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  deduction_date DATE NOT NULL,
  paid_date TIMESTAMPTZ,
  
  -- Status: pending, paid, cancelled
  status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending', 'paid', 'cancelled')),
  
  -- Notes
  notes TEXT,
  created_by TEXT,
  
  -- Timestamps
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- Indexes for better query performance
CREATE INDEX idx_employee_purchases_employee_name ON employee_purchases(employee_name);
CREATE INDEX idx_employee_purchases_status ON employee_purchases(status);
CREATE INDEX idx_employee_purchases_deduction_date ON employee_purchases(deduction_date);
CREATE INDEX idx_employee_purchases_created_at ON employee_purchases(created_at DESC);

-- Update trigger for updated_at
CREATE OR REPLACE FUNCTION update_employee_purchases_updated_at()
RETURNS TRIGGER AS $$
BEGIN
  NEW.updated_at = NOW();
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER update_employee_purchases_updated_at_trigger
  BEFORE UPDATE ON employee_purchases
  FOR EACH ROW
  EXECUTE FUNCTION update_employee_purchases_updated_at();

-- Comments
COMMENT ON TABLE employee_purchases IS 'Employee salary deduction purchases';
COMMENT ON COLUMN employee_purchases.employee_name IS 'Employee name (manual text input)';
COMMENT ON COLUMN employee_purchases.status IS 'pending, paid, or cancelled';
COMMENT ON COLUMN employee_purchases.deduction_date IS 'Date when amount will be deducted from salary';
COMMENT ON COLUMN employee_purchases.paid_date IS 'Date when purchase was marked as paid';`;

    async function runMigration() {
      const outputDiv = document.getElementById('output');
      const runBtn = document.getElementById('runBtn');
      const supabaseUrl = document.getElementById('supabaseUrl').value.trim();
      const supabaseKey = document.getElementById('supabaseKey').value.trim();

      if (!supabaseUrl || !supabaseKey) {
        outputDiv.innerHTML = '<div class="error">❌ Please provide both Supabase URL and Service Role Key</div>';
        return;
      }

      runBtn.disabled = true;
      outputDiv.innerHTML = '⏳ Running migration...\n\n';

      try {
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Execute the SQL
        const { data, error } = await supabase.rpc('exec_sql', { sql_query: SQL });

        if (error) {
          // Try alternative method: direct query
          const statements = SQL.split(';').filter(s => s.trim());
          let results = [];

          for (let i = 0; i < statements.length; i++) {
            const stmt = statements[i].trim();
            if (!stmt) continue;

            outputDiv.innerHTML += `Executing statement ${i + 1}/${statements.length}...\n`;

            const { error: stmtError } = await supabase.from('_').select('*').limit(0);
            
            // Use REST API instead
            const response = await fetch(`${supabaseUrl}/rest/v1/rpc/exec_sql`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': supabaseKey,
                'Authorization': `Bearer ${supabaseKey}`
              },
              body: JSON.stringify({ sql_query: stmt + ';' })
            });

            if (!response.ok) {
              throw new Error(`Statement ${i + 1} failed: ${await response.text()}`);
            }
          }

          outputDiv.innerHTML += '\n<div class="success">✅ Migration completed successfully!</div>';
          outputDiv.innerHTML += '\nThe employee_purchases table has been recreated with employee_name field.\n';
          outputDiv.innerHTML += 'You can now use the Employee Purchase feature.';
        } else {
          outputDiv.innerHTML += '\n<div class="success">✅ Migration completed successfully!</div>';
          outputDiv.innerHTML += '\nResult: ' + JSON.stringify(data, null, 2);
        }
      } catch (error) {
        outputDiv.innerHTML += '\n<div class="error">❌ Error: ' + error.message + '</div>';
        outputDiv.innerHTML += '\n\nPlease run this SQL manually in your Supabase SQL Editor:\n\n';
        outputDiv.innerHTML += SQL;
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
